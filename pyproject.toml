[project]
name = "omt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "LR", email = "globallr86@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "langchain>=1.4.4",
    "langchain-deepseek>=1.1.1",
    "langgraph>=1.2.14",
    "loadenv>=0.1.1",
    "prompt-toolkit>=3.0.52",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
]

[project.scripts]
omt = "omt.coding_agent.session:session"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
